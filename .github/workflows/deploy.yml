name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, skipping intermediate runs but not cancelling in-progress runs
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Flutter Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build site and Flutter web app
        run: bash scripts/build_site.sh

      - name: Verify deploy artifacts
        run: |
          test -f deploy/index.html || { echo "Missing deploy/index.html"; exit 1; }
          test -f deploy/about.html || { echo "Missing deploy/about.html"; exit 1; }
          test -f deploy/contact.html || { echo "Missing deploy/contact.html"; exit 1; }
          test -f deploy/privacypolicy.html || { echo "Missing deploy/privacypolicy.html"; exit 1; }
          test -f deploy/404.html || { echo "Missing deploy/404.html"; exit 1; }
          test -f deploy/.nojekyll || { echo "Missing deploy/.nojekyll"; exit 1; }
          test -f deploy/flutter_service_worker.js || { echo "Missing deploy/flutter_service_worker.js"; exit 1; }
          test -f deploy/home/index.html || { echo "Missing deploy/home/index.html"; exit 1; }
          echo "All required deploy artifacts verified successfully."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

