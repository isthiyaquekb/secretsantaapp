<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secret Santa</title>
  <script>
    (function() {
      var pathname = window.location.pathname;
      // If user navigated to /privacypolicy without trailing slash
      if (pathname === '/privacypolicy' || pathname.indexOf('/privacypolicy/') === 0) {
        window.location.replace('/privacypolicy/');
        return;
      }
      // Redirect to Flutter Web app root preserving search and hash
      var target = '/' + (window.location.search || '') + (window.location.hash || '');
      window.location.replace(target);
    })();
  </script>
  <style>
    :root { --bg: #F9F7F7; --ink: #1E1416; --red: #9E1B26; }
    @media (prefers-color-scheme: dark) { :root { --bg: #171112; --ink: #F5ECEC; --red: #E5656B; } }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    a { color: var(--red); text-decoration: none; font-weight: 600; margin: 0 8px; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>Page Not Found</h1>
    <p>Redirecting to Secret Santa...</p>
    <p>
      <a href="/">Open App</a> &middot;
      <a href="/privacypolicy/">Privacy Policy</a>
    </p>
  </main>
</body>
</html>
