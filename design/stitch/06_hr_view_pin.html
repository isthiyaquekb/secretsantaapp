<script>
  (function initHrPinPad() {
    let currentPin = "24"; // Initially 2 digits filled to match mockup spec
    const maxDigits = 4;
    const dots = document.querySelectorAll('#pin-indicator-group .pin-dot');
    const feedback = document.getElementById('pin-feedback');

    function updateDots() {
      dots.forEach((dot, idx) => {
        if (idx < currentPin.length) {
          dot.className = 'pin-dot w-3.5 h-3.5 rounded-full bg-primary transition-all duration-200 transform scale-100 shadow-sm';
        } else {
          dot.className = 'pin-dot w-3.5 h-3.5 rounded-full bg-surface-container-highest transition-all duration-200 transform scale-100';
        }
      });
      if (feedback) feedback.style.opacity = '0';
    }

    function triggerShake() {
      const container = document.getElementById('pin-indicator-group');
      if (container) {
        container.classList.add('translate-x-1');
        setTimeout(() => container.classList.remove('translate-x-1'), 70);
        setTimeout(() => container.classList.add('-translate-x-1'), 140);
        setTimeout(() => container.classList.remove('-translate-x-1'), 210);
      }
      if (feedback) {
        feedback.style.opacity = '1';
      }
    }

    document.querySelectorAll('.keypad-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const val = btn.getAttribute('data-key');
        if (currentPin.length < maxDigits) {
          currentPin += val;
          updateDots();

          if (currentPin.length === maxDigits) {
            // Simulated validation
            setTimeout(() => {
              if (currentPin === "1234" || currentPin === "2412") {
                // Success state simulation
                dots.forEach(dot => {
                  dot.className = 'pin-dot w-3.5 h-3.5 rounded-full bg-secondary-container transition-all duration-200 shadow-sm';
                });
              } else {
                triggerShake();
                setTimeout(() => {
                  currentPin = "";
                  updateDots();
                }, 750);
              }
            }, 180);
          }
        }
      });
    });

    const backspaceBtn = document.getElementById('backspace-btn');
    if (backspaceBtn) {
      backspaceBtn.addEventListener('click', () => {
        if (currentPin.length > 0) {
          currentPin = currentPin.slice(0, -1);
          updateDots();
        }
      });
    }

    const biometricsBtn = document.getElementById('biometrics-btn');
    if (biometricsBtn) {
      biometricsBtn.addEventListener('click', () => {
        currentPin = "2412";
        updateDots();
      });
    }

    updateDots();
  })();
</script></main></div></body></html>
