<script>
  (function() {
    const list = document.getElementById('participants-list');
    const input = document.getElementById('name-input');
    const addBtn = document.getElementById('add-btn');
    const countLabel = document.getElementById('participant-count-label');

    function updateCount() {
      const count = list.querySelectorAll('.participant-row').length;
      countLabel.textContent = count === 1 ? '1 person in the draw' : count + ' people in the draw';
    }

    function createRow(name) {
      const trimmed = name.trim();
      if (!trimmed) return;

      const initial = trimmed.charAt(0).toUpperCase();
      const row = document.createElement('div');
      row.className = 'participant-row flex items-center justify-between py-3.5 bg-surface hover:bg-surface-container-low transition-colors px-2 rounded-lg';
      row.setAttribute('data-name', trimmed);

      row.innerHTML = `
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center font-label-md text-label-md text-secondary">
            ${initial}
          </div>
          <span class="font-body-lg text-body-lg text-on-surface font-normal">${trimmed}</span>
        </div>
        <button type="button" class="remove-btn p-1.5 rounded-full text-tertiary hover:text-on-surface hover:bg-surface-container transition-colors cursor-pointer" aria-label="Remove ${trimmed}">
          <span class="material-symbols-outlined text-[18px]">close</span>
        </button>
      `;

      list.appendChild(row);
      updateCount();
    }

    addBtn.addEventListener('click', function() {
      if (input.value.trim().length > 0) {
        createRow(input.value);
        input.value = '';
        input.focus();
      }
    });

    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        addBtn.click();
      }
    });

    list.addEventListener('click', function(e) {
      const removeBtn = e.target.closest('.remove-btn');
      if (removeBtn) {
        const row = removeBtn.closest('.participant-row');
        if (row) {
          row.remove();
          updateCount();
        }
      }
    });
  })();
